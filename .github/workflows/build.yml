name: Compiler AikoShield

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tests des détecteurs
        run: |
          mkdir -p screenshots
          cd macos
          xcrun swiftc -swift-version 5 Sources/Detectors.swift Tests/detectors/main.swift -o /tmp/detecteurs 2>&1 | tee ../screenshots/detecteurs-compilation.txt
          /tmp/detecteurs 2>&1 | tee ../screenshots/detecteurs.txt
      - name: Test de lecture d'écran (Vision)
        if: always()
        run: |
          cd macos
          xcrun swiftc -swift-version 5 Sources/Detectors.swift Sources/Recognizer.swift Sources/Geometry.swift \
            Sources/Theme.swift Tests/ocr/main.swift -o /tmp/ocr 2>&1 | tee ../screenshots/ocr-compilation.txt
          /tmp/ocr ../screenshots 2>&1 | tee ../screenshots/ocr.txt
      - name: Compilation de l'appli (universelle)
        if: always()
        run: |
          set +e
          UNIVERSAL=1 ./macos/build.sh > screenshots/build.log 2>&1
          code=$?
          cat screenshots/build.log
          grep -E "error:" screenshots/build.log | head -n 15 | while IFS= read -r l; do echo "::error title=Compilation::$l"; done
          exit $code
      - name: Publier le rapport (branche captures-Mac)
        if: always()
        run: |
          cd screenshots || exit 0
          git init -q -b captures-Mac
          git -c user.name=ci -c user.email=ci@aikoshield add -A
          git -c user.name=ci -c user.email=ci@aikoshield commit -q -m "Rapport Mac" || exit 0
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:captures-Mac
      - name: Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/AikoShield.app dist/AikoShield-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AikoShield-Mac
          path: dist/AikoShield-Mac.zip
